      ddl-auto: create-drop
    show-sql: true
    open-in-view: false  # ← Vaadin-Warning fix
  h2:
    console:
      enabled: true
  security:
    user:
      name: admin
      password: admin123
  ai:                    # ← KORREKT: spring.ai!
    openai:
      enabled: false     # ← OpenAI deaktivieren
      api-key: dummy     # ← Dummy

vaadin:                     # ← Top-Level!
  allowed-packages: de.electrogutachten  # ← Scan fix