name: electroGutachten CI/CD

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

# Verhindert parallele Deployments (nur ein Deploy gleichzeitig)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ──────────────────────────────────────────────────────────
  # Job 1: Tests (läuft bei jedem Push + PR)
  # ──────────────────────────────────────────────────────────
  test:
    name: Tests & Code-Qualität
    runs-on: ubuntu-latest

    services:
      # PostgreSQL 16 + PGVector für Integrationstests
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: electrogutachten_test
          POSTGRES_USER: eg_user
          POSTGRES_PASSWORD: eg_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eg_user"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven-Abhängigkeiten cachen
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Unit-Tests ausführen (Domain + Application)
        run: mvn clean test --no-transfer-progress
        env:
          SPRING_PROFILES_ACTIVE: dev
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/electrogutachten_test
          SPRING_DATASOURCE_USERNAME: eg_user
          SPRING_DATASOURCE_PASSWORD: eg_pass
          OPENAI_API_KEY: sk-test-dummy-key-ci
          SPRING_AI_OPENAI_API_KEY: sk-test-dummy-key-ci

      - name: Test-Report publizieren
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: JUnit Test Results
          path: target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: JaCoCo Coverage-Report
        run: mvn jacoco:report --no-transfer-progress
        continue-on-error: true

      - name: Coverage-Summary ausgeben
        run: |
          if [ -f target/site/jacoco/index.html ]; then
            echo "Coverage-Report generiert: target/site/jacoco/index.html"
          fi

  # ──────────────────────────────────────────────────────────
  # Job 2: Build + Docker Push (nur auf master/main)
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: Docker Build & Push
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write   # Für GitHub Container Registry (ghcr.io)

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Maven-Abhängigkeiten cachen
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: JAR bauen (Tests überspringen — laufen in Job 1)
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei GitHub Container Registry anmelden
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Image Tags bestimmen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/electrogutachten
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short
            type=raw,value=v${{ github.run_number }}

      - name: Docker Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=v${{ github.run_number }}
            BUILD_DATE=${{ github.event.head_commit.timestamp }}

      - name: Image-Digest ausgeben
        run: echo "Image gebaut und gepusht → ghcr.io/${{ github.repository_owner }}/electrogutachten:latest"

  # ──────────────────────────────────────────────────────────
  # Job 3: Security-Scan (OWASP Dependency Check)
  # ──────────────────────────────────────────────────────────
  security-scan:
    name: Security Dependency Scan
    needs: test
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: OWASP Dependency-Check ausführen
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            --no-transfer-progress \
            || echo "Dependency-Check abgeschlossen (Warnstufe CVSS < 9 ignoriert)"
        continue-on-error: true

      - name: Security-Report als Artefakt speichern
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: target/dependency-check-report.html
          retention-days: 30
