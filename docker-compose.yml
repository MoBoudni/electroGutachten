version: '3.9'

# electroGutachten — Docker Compose
# Start: docker-compose up -d
# App:   http://localhost:8081
# Swagger: http://localhost:8081/swagger-ui.html

services:

  # ── PostgreSQL 16 mit PGVector Extension ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: eg-postgres
    environment:
      POSTGRES_DB: electrogutachten
      POSTGRES_USER: eg_user
      POSTGRES_PASSWORD: eg_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eg_user -d electrogutachten"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Session-Management, Caching) ───────────────────────────
  redis:
    image: redis:7-alpine
    container_name: eg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Spring Boot Backend ───────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eg-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/electrogutachten
      SPRING_DATASOURCE_USERNAME: eg_user
      SPRING_DATASOURCE_PASSWORD: eg_pass
      SPRING_REDIS_HOST: redis
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-https://auth.electrogutachten.de}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Traefik Reverse Proxy (HTTPS) ─────────────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: eg-traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"   # Traefik Dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    profiles:
      - production   # nur im Production-Profil aktiv

  # ── Ollama (lokale KI — optional, für DSGVO-Offline-Betrieb) ─────
  ollama:
    image: ollama/ollama:latest
    container_name: eg-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - local-ai     # nur bei --profile local-ai aktiv

volumes:
  postgres_data:
  ollama_data:
